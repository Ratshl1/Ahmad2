<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>تحب امك؟</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      touch-action: manipulation;
    }

    /*
      إطار الموقع:
      على الهاتف يأخذ كامل الشاشة.
    */
    .phone {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    /*
      =========================
      الشاشة الأولى
      =========================
    */
    #firstScreen {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
    }

    #firstScreen > img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /*
      طبقة شفافة خفيفة تجعل السؤال واضحاً
      فوق الصورة.
    */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.16);
      pointer-events: none;
    }

    /*
      السؤال والأزرار في منتصف الشاشة تماماً.
      top/left + translate يجعل مركز المجموعة
      مطابقاً تماماً لمركز الشاشة.
    */
    .question-container {
      position: absolute;
      z-index: 5;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      width: min(92vw, 430px);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;

      text-align: center;
    }

    .question {
      margin: 0;
      color: #fff;
      font-size: clamp(30px, 8vw, 48px);
      font-weight: 900;
      line-height: 1.2;
      white-space: nowrap;

      text-shadow:
        0 3px 12px rgba(0, 0, 0, 0.95),
        0 1px 3px rgba(0, 0, 0, 0.95);
    }

    /*
      الأزرار بجانب بعضها وفي المنتصف.
    */
    .buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      min-height: 58px;
    }

    button {
      border: 0;
      outline: none;

      min-width: 115px;
      min-height: 54px;
      padding: 12px 24px;

      border-radius: 999px;

      color: #fff;
      font-family: inherit;
      font-size: 20px;
      font-weight: 800;

      cursor: pointer;
      user-select: none;
      touch-action: manipulation;

      box-shadow: 0 7px 20px rgba(0, 0, 0, 0.35);
    }

    /*
      زر نعم يبقى في مكانه.
    */
    #yes {
      background: linear-gradient(135deg, #ff4f8b, #e91e63);
    }

    #yes:active {
      transform: scale(0.96);
    }

    /*
      زر لا يتم وضعه fixed حتى يستطيع التحرك
      في أي مكان داخل إطار الهاتف.
    */
    #no {
      position: fixed;
      z-index: 20;
      background: linear-gradient(135deg, #555d6e, #252936);
    }

    /*
      =========================
      الشاشة الثانية
      =========================
    */
    #secondScreen {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: none;
      overflow: hidden;
      background: #000;
    }

    #secondScreen > img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /*
      على الشاشات الصغيرة جداً.
    */
    @media (max-width: 430px) {
      .question-container {
        width: 94vw;
        gap: 20px;
      }

      .buttons {
        gap: 12px;
      }

      button {
        min-width: 108px;
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <main class="phone" id="phone">

    <!-- الصورة والسؤال والأزرار -->
    <section id="firstScreen">

      <img
        src="IMG_5846.jpeg"
        alt=""
      >

      <div class="overlay"></div>

      <div class="question-container">

        <h1 class="question">تحب امك ؟</h1>

        <div class="buttons">

          <button id="yes" type="button">
            نعم ❤️
          </button>

          <button id="no" type="button">
            لا
          </button>

        </div>

      </div>

    </section>


    <!-- الصورة التي تظهر بعد الضغط على نعم -->
    <section id="secondScreen">

      <img
        src="FCCB0F59-B70A-4099-AB92-8541D46002F8.png"
        alt=""
      >

    </section>


    <!-- الصوت -->
    <audio id="music" preload="auto">
      <source
        src="ssstik.io_1790868855744.mp3"
        type="audio/mpeg"
      >
    </audio>

  </main>


  <script>
    const phone = document.getElementById("phone");
    const noButton = document.getElementById("no");
    const yesButton = document.getElementById("yes");
    const secondScreen = document.getElementById("secondScreen");
    const music = document.getElementById("music");


    /*
      نقل زر "لا" إلى مكان عشوائي داخل
      حدود إطار الهاتف فقط.
    */
    function moveNoButton() {

      const phoneRect = phone.getBoundingClientRect();

      const padding = 10;

      const buttonWidth = noButton.offsetWidth;
      const buttonHeight = noButton.offsetHeight;

      const minX = phoneRect.left + padding;
      const minY = phoneRect.top + padding;

      const maxX =
        phoneRect.right - buttonWidth - padding;

      const maxY =
        phoneRect.bottom - buttonHeight - padding;

      const availableX = Math.max(0, maxX - minX);
      const availableY = Math.max(0, maxY - minY);

      const randomX =
        minX + Math.random() * availableX;

      const randomY =
        minY + Math.random() * availableY;

      noButton.style.left = randomX + "px";
      noButton.style.top = randomY + "px";
    }


    /*
      عند لمس أو الضغط على "لا":
      الزر يهرب فوراً قبل أن يتم الضغط عليه.
      يعمل على الهاتف والكمبيوتر.
    */
    noButton.addEventListener("pointerdown", function (event) {

      event.preventDefault();
      event.stopPropagation();

      moveNoButton();
    });


    /*
      احتياط إضافي للمتصفحات التي تتعامل
      مع click بشكل مختلف.
    */
    noButton.addEventListener("click", function (event) {

      event.preventDefault();
      event.stopPropagation();

      moveNoButton();
    });


    /*
      عند الضغط على "نعم":
      - تظهر الصورة الثانية فوراً.
      - يبدأ الصوت مباشرة بعد ضغطة المستخدم.
    */
    yesButton.addEventListener("click", async function () {

      secondScreen.style.display = "block";

      try {

        music.currentTime = 0;

        await music.play();

      } catch (error) {

        console.log(
          "تعذر تشغيل الصوت:",
          error
        );

      }

    });


    /*
      إذا تغير حجم الشاشة أو تم تدوير الهاتف،
      نعيد زر "لا" إلى مكان عشوائي داخل الإطار
      حتى لا يخرج منه.
    */
    window.addEventListener("resize", function () {

      if (noButton.style.left !== "") {
        moveNoButton();
      }

    });
  </script>

</body>
</html>
